<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="style.css">
    <title>Business Blog Card</title>
    <style>
    </style>

  <body>
    <div class="container">
      <div class="card">
        <div class="image-layer">
          <img src="resources/hero-image-1.jpg" alt="">
          <svg class="wave-divider" viewBox="0 0 500 80" preserveAspectRatio="none">
            <path d="M0,45 C150,85 320,5 500,45 L500,80 L0,80 Z" fill="#ffffff"></path>
          </svg>
        </div>
        <div class="body-layer">
          <h2>Perfect solution for small business</h2>
          <p>Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
        </div>
        <hr class="seprator-line">
        <div class="author-layer">
          <div class="avatar">
            <img src="resources/avatar-image-business-card-1.png" alt="image author">
          </div>
          <div class="author-info">
            <h4>Amy Burgess</h4>
            <p>Customer Manager, Solution Oy</p>
          </div>
        </div>
      </div>
