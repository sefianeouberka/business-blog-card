<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="style.css">
    <title>Business Blog Card</title>
  </head>
  <body>
    <main class="page_stage">
      <article class="card_container" aria-labelledby="card_title">
        <div class="card_media">
          <img class="card_image" src="resources/hero-image-1.jpg" alt="two persone in a caffee">
          <svg
            class="card__wave"
            viewBox="0 0 500 80"
            preserveAspectRatio="none"
            aria-hidden="true"
            focusable="false"
            >
            <path
              d="M0,68 C120,76 235,14 345,14 C415,14 455,48 500,68 L500,80 L0,80 Z"
              fill="currentColor"
            />
          </svg>
        </div>
        <div class="card_body">
          <h2 id="card_title" class="card_title"> Perfect solution for small business </h2>
          <p class="card_description"> 
            Small businesses need to generate leads to grow. You can use tools like Ringy.
          </p>
        </div>
        <footer class="card_aothor">
          <div class="card_avatar">
            <img src="resources/avatar-image-business-card-1.png" alt="image of persone">
          </div>
          <div class="card_info_author">
            <p class="name_author"> Amy Burgess </p>
            <p class="job_position">Customer Manager, Solution Oy</p>
          </div>
        </footer>
      </article>
    </main>
  </body>
</html>
